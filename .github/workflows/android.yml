name: Android checks

on:
  push:
    branches: [main, codex/android-setup]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, check screenshots, lint, and build
        run: ./gradlew :app:testDebugUnitTest :app:validateDebugScreenshotTest :app:lintDebug :app:assembleDebug --no-daemon
