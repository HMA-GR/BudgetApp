name: Android checks

on:
  push:
    branches: [main, codex/android-setup]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, check screenshots, lint, and build
        run: ./gradlew :app:testDebugUnitTest :app:validateDebugScreenshotTest :app:lintDebug :app:assembleDebug --no-daemon
