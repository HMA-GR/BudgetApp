name: Signed Android APK

on:
  push:
    branches: [main, codex/android-setup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets and decode file
        env:
          BUDGET_KEYSTORE_B64: ${{ secrets.BUDGET_KEYSTORE_B64 }}
          BUDGET_KEYSTORE_PASSWORD: ${{ secrets.BUDGET_KEYSTORE_PASSWORD }}
          BUDGET_KEY_ALIAS: ${{ secrets.BUDGET_KEY_ALIAS }}
          BUDGET_KEY_PASSWORD: ${{ secrets.BUDGET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BUDGET_KEYSTORE_B64:?GitHub secret BUDGET_KEYSTORE_B64 eksik}"
          : "${BUDGET_KEYSTORE_PASSWORD:?GitHub secret BUDGET_KEYSTORE_PASSWORD eksik}"
          : "${BUDGET_KEY_ALIAS:?GitHub secret BUDGET_KEY_ALIAS eksik}"
          : "${BUDGET_KEY_PASSWORD:?GitHub secret BUDGET_KEY_PASSWORD eksik}"
          umask 077
          printf '%s' "$BUDGET_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/budget-release.jks"
          printf 'Signing file SHA-256: '
          sha256sum "$RUNNER_TEMP/budget-release.jks" | cut -d ' ' -f1
          echo "BUDGET_KEYSTORE_FILE=$RUNNER_TEMP/budget-release.jks" >> "$GITHUB_ENV"
      - name: Check keystore password and alias
        env:
          BUDGET_KEYSTORE_PASSWORD: ${{ secrets.BUDGET_KEYSTORE_PASSWORD }}
          BUDGET_KEY_ALIAS: ${{ secrets.BUDGET_KEY_ALIAS }}
        run: keytool -list -storetype JKS -keystore "$BUDGET_KEYSTORE_FILE" -storepass:env BUDGET_KEYSTORE_PASSWORD -alias "$BUDGET_KEY_ALIAS"
      - name: Test and validate screenshots
        run: ./gradlew :app:testDebugUnitTest :app:validateDebugScreenshotTest :app:lintDebug --no-daemon
      - name: Build signed APK
        env:
          BUDGET_KEYSTORE_PASSWORD: ${{ secrets.BUDGET_KEYSTORE_PASSWORD }}
          BUDGET_KEY_ALIAS: ${{ secrets.BUDGET_KEY_ALIAS }}
          BUDGET_KEY_PASSWORD: ${{ secrets.BUDGET_KEY_PASSWORD }}
          BUDGET_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BudgetApp-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
